name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag'
        required: true
        type: string

jobs:
  Prepare_new_release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: TanguyBarthelemy/r-release-action@f7096af2950cff1ec606b78c3530a5f9fce86c7f
        with:
          tag: ${{ github.event.inputs.tag }}
          gh_repo: "TanguyBarthelemy/IssueTrackeR"
          main-branch: "main"
          dev-branch: "develop"

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag'
        required: true
        type: string

jobs:
  Prepare_new_release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.WORKFLOW_TOKEN }}

    steps:
      - uses: TanguyBarthelemy/r-release-action
        with:
          tag: ${{ github.event.inputs.tag }}
          gh_repo: "TanguyBarthelemy/IssueTrackeR"
          main-branch: "main"
          dev-branch: "develop"
          github_token: ${{ env.GITHUB_PAT }}

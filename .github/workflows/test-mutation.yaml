on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: Mutation Testing

jobs:
  mutation-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            jakubsob/muttest

      - name: Run mutation tests
        shell: Rscript {0}
        run: |
          plan <- muttest::muttest_plan(c(
              muttest::arithmetic_operators(),
              muttest::comparison_operators(),
              muttest::logical_operators(),
              # muttest::boolean_literal(),
              # muttest::string_literals(),
              muttest::numeric_increment(),
              muttest::numeric_decrement(),
              muttest::numeric_literals(),
              muttest::remove_negation(),
              muttest::condition_mutations(),
              # muttest::call_name(),
              # muttest::na_literal(),
              muttest::na_literals(),
              # muttest::replace_return_value(),
              muttest::index_mutations()
          ))
          muttest::muttest(plan)

on:
  workflow_dispatch:
  push:
    branches:
      - develop

name: Bump dev version

jobs:
  update_version:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:

    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Bump dev version
      uses: DanChaltiel/actions/bump-dev-version@21e0e0f599d32d1935e5580dd3c2f3d1ad2fec35

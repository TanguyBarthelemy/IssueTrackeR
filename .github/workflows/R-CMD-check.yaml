# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: R-CMD-check

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      full_check:
        description: 'Full check'
        required: false
        type: boolean
        default: false

permissions: read-all

jobs:
  setup-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Define test matrix
        id: set-matrix
        shell: bash
        env:
          FULL_CHECK: ${{ inputs.full_check || false }}
        run: |
          if [ "$FULL_CHECK" = "true" ]; then
            MATRIX='[
              {"os":"macos-latest","r":"release"},
              {"os":"macos-latest","r":"oldrel-1"},
              {"os":"macos-latest","r":"oldrel-2"},
              {"os":"macos-latest","r":"4.2.0"},

              {"os":"windows-latest","r":"devel","http-user-agent":"release"},
              {"os":"windows-latest","r":"next","http-user-agent":"release"},
              {"os":"windows-latest","r":"release"},
              {"os":"windows-latest","r":"oldrel-1"},
              {"os":"windows-latest","r":"oldrel-2"},
              {"os":"windows-latest","r":"oldrel-3"},
              {"os":"windows-latest","r":"4.2.0"},

              {"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},
              {"os":"ubuntu-latest","r":"next","http-user-agent":"release"},
              {"os":"ubuntu-latest","r":"release"},
              {"os":"ubuntu-latest","r":"oldrel-1"},
              {"os":"ubuntu-latest","r":"oldrel-2"},
              {"os":"ubuntu-latest","r":"oldrel-3"},
              {"os":"ubuntu-latest","r":"4.2.0"}
            ]'
          else
            MATRIX='[
              {"os":"macos-latest","r":"release"},
              {"os":"windows-latest","r":"release"},
              {"os":"ubuntu-latest","r":"release"}
            ]'
          fi

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: setup-matrix

    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}${{ matrix.config.java && format(', Java {0}', matrix.config.java) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.WORKFLOW_TOKEN }}
      GITLAB_SSPCLOUD_API: ${{ secrets.GITLAB_SSPCLOUD_API }}
      GITLAB_TRACTORTOM_API: ${{ secrets.GITLAB_TRACTORTOM_API }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

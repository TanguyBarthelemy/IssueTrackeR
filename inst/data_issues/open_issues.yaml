    to an actual xml schema; it just defines a tree structure with a small set of
    possible nodes. So, you are not able to validate your xml (except for the syntax).\r\n\r\nI
    made for v2 a true xml schema, but it was really cumbersome and I think that nearly
    nobody used it. See [jtss/src/main/resources](https://github.com/jdemetra/jdemetra-core/tree/develop/jtss/src/main/resources)
    for more details.\r\n\r\nIn the future, if we want to build WEB/GRPC-services,
    we probably should use well-defined and documented protocols (based for instance
    on protos files). Developments for the medium term."

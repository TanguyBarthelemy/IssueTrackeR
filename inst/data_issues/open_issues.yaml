  Currently, to call a refresh policy (in the GUI or the cruncher), the ts metadata of a SA-Item have to be filled and accurate.

  But is there a way to refresh a model (with any refresh policy) but without refreshing the data (so just applying the domain and estimation spec with the current data in the SA-Processing or producing outputs)?


  ## Questions

  ### Change and preview a theme

  When you want to change the theme in the GUI, you have to restart the interface. It would be interesting to have a preview (without necessarily updating the interface) to choose a theme.

  ### Light and dark

  Also, in many programs, it is possible to choose a “light” and a “dark” theme and toggle between the 2:

  - manually with the user
  - automatically according to the system theme

  ### Customisation

  Finally, in many dark themes, the color of the writing is often dark too, and black on black is not very legible. Similarly, some graphics retain white backgrounds.
  Perhaps an in-between?

  Are these themes hard-coded in JDemetra+ or do you use external themes?

  Can we imagine (one day) giving users the possibility of modifying and customizing their own theme?


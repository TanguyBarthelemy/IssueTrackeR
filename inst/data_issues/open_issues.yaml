    I don't see any benefits in making the specific items less specific, or do you have a use case in mind?

    I think adding a function to the R Package could be beneficial, is it not easily accessible at the moment?

    P.S. We at the Bundesbank use the metadata in v2 at the moment for a lot of plugin specific information e.g. in the CompRes plugin for specifying where to find old factors, and plan to use them again.
  - |
    I don't want the items to be less specific but just put them in the metadata section, where they'll maybe fit better (keeping there item names).

    It's more a question / general comment than a suggestion.
  - |-
    I have two comments on the metadata
    - The metadata are probably underused for the time  being. The use case of the Bundesbank is surely a good example of what we could do.  Adding functions to manage them in R is surely a good idea. You can indeed put what you want in metadata. However, we should avoid putting information available elsewhere: quality, priority, policy are already defined in SaItem (ensuring coherence could become complex)
    - I am not convinced by the use of the metadata to specify the refreshing policy. Refreshing policies are linked to different steps in the production chain: for instance, we refresh everything once every two years and we just refresh a few information (parameters, coefficients...) every month; that doesn't depend on the series. Series with different lifetime should be grouped in different workspaces. But of course, you a free to develop your personal approach...
  - |-
    > However, we should avoid putting information available elsewhere: quality, priority, policy are already defined in SaItem (ensuring coherence could become complex)

    I wasn't thinking of copying the information but rather of moving it into metadata.

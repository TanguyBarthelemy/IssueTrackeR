  - [`randomF`](https://github.com/jdemetra/jdplus-main/blob/88cb98a6f80adbbe3566f31e8ed910f1e46f1d36/jdplus-main-base/jdplus-toolkit-base-parent/jdplus-toolkit-base-r/src/main/java/jdplus/toolkit/base/r/stats/Distributions.java#L90-L99)

  with packages R packages (issue rjdverse/rjd3workspace#91).\n\nRelated to rjdverse/rjd3providers#24\nI
  think it's related to jdemetra/jdemetra-app#409"
- "I just created a new WS with csv and Excel files. \nWhen I try to read it from
  R, I get `(frozen)` in the name of the SA-Items:\n\nhttps://github.com/user-attachments/assets/28fffeb1-b58c-42d5-8219-c440d30248d9\n\nHere
  is the R code:\n\n``` r\nlibrary(\"rjd3workspace\")\n\njws <- jws_open(\"~/tmp.xml\")\njsap
  <- jws_sap(jws, 1L)\nsap_sai_names(jsap)\n#> [1] \"IPI\\nRF0610 (frozen)\" \"IPI\\nRF0620
  (frozen)\" \"RF0811 (frozen)\"     \n#> [4] \"RF0812 (frozen)\"\n```\n\n<sup>Created
  on 2026-01-20 with [reprex v2.1.1](https://reprex.tidyverse.org)</sup>\n\nI think
  the items are automatically renamed with `(frozen)`. Should it move to a metadata
  than the series name?\n\nRelated to:\n\n- jdemetra/jdemetra-app#343\n- #597\n- #653
  \n"

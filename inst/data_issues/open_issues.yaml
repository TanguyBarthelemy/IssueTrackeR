- See https://github.com/jdemetra/jdplus-main/blob/develop/jdplus-main-base/jdplus-toolkit-base-parent/jdplus-toolkit-base-api/src/main/java/jdplus/toolkit/base/api/timeseries/TimeSelector.java
- "(Version: 3.2.2-SNAPSHOT)\r\n\r\n- A graph's display options can be modified via
  the 'Configure...' context menu when right-clicking on it. This brings up a dialogue
  box with an option to change the 'Color scheme'. However, the different colour options
  are not presented as a user-friendly drop-down list. Instead, the user must somehow
  know in advance what the options are and start typing letters to see the colour
  options appear. (And if the 'wrong' letters are typed, then the options shown to
  the viewer are limited.) There shouldn't be a need to type; the user should merely
  just select one option from the list of all possible colour schemes.\r\n\r\n- Another
  issue is that the name of the colour option changes once it is clicked on. For example,
  when selecting 'Ice Cream Sandwich - Dark' (first image below), it changes to 'Android
  - Dark' (second image below).\r\n\r\n![image](https://github.com/jdemetra/jdplus-main/assets/110582146/6f94b807-acce-4d5d-ab1c-9d0f8c02092b)\r\n\r\n![image](https://github.com/jdemetra/jdplus-main/assets/110582146/3e18e9e5-84ea-469f-886d-6fa8a8b40056)\r\n\r\n-
  There is also no option for selecting the default colour scheme. (Admittedly, the
  selection field is prepopulated with the text of the default colour scheme, but
  this isn't explicit enough.)\r\n\r\n- Finally, it would be nice to allow the user
  to single-click to select an option, rather than have to double-click. (For example,
  when selecting the 'Line thickness' in the same dialogue box, only a single-click
  is required.)"
- "Current branding of JD+ is outdated and inconsistent.\r\n\r\nHere is a non-exhaustive
  list of items to update and improve:\r\n1. icon, favicon and avatar (square shape,
  logo only)\r\n2. splash screen, about dialog image and banner (rectangular shape,
  landscape orientation, logo+text)\r\n3. short description (a few words)\r\n4. longer
  description (a few sentences)\r\n5. URLs and domain name"
- "See https://openjdk.org/jeps/272\r\n\r\nMost [nbbrd desktop API](https://github.com/nbbrd/java-desktop-util/)
  can be replaced by the latest JDK desktop API. \r\nThere are a few exceptions anyway:
  search and kwown folders"

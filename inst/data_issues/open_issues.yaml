- text: "Hello Gustavo, \n\nCurrently, it is not possible to use a calendar in `.cfgx`
    format generated by version 2 directly in version 3.\n\nTo use calendars in version
    3, there are two methods:\n\n### 1st solution: Create the calendar via the GUI
    or in R and add it to a WS\n\nYou can recreate the calendar manually via Utilities
    or use the functions in [{rjd3toolkit}](https://github.com/rjdverse/rjd3toolkit).\n\n###
    Solution 2: Convert a WS v2 that contains a calendar \n\n1) Add your calendar
    in version 2 to a WS\n2) Save the WS\n3) Reopen the WS in version 3\n4) Export
    / use the calendar\n"

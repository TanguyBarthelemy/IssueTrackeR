  Consider opening a new workspace via **File | Open Workspace** and having the corresponding dialogue box appear. If the user presses the `Esc` key on the keyboard, then it will conveniently close, as expected.

  However, dialogue boxes like the 'Pre-specified outliers' or 'Variables' ones (opened via the Specifications panel) will not close if the `Esc` key is pressed.

  It would be convenient and help to speed up the user's operations in the JD+ GUI if they can use the `Esc` key to close such dialogue boxes, rather than reaching for the mouse to close them via the `X` close button which is slightly slower to do.

  (Note by the way that, in testing things for reporting this issue, I also discovered that when I press `Esc` on the **Save Workspace As...** dialogue box, it not only closes it, but also closes the currently active multi-document, which doesn't seem right.)

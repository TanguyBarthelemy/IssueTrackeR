- "Hi JDemetra+ devs,\r\nWe are using cruncher v3 in a data processing application
  implemented in Java. At a high level we are calling jdplus.cruncher.App.main with
  a valid workspace and parameters file, then parsing the output files for consumption
  by downstream services.\r\nOne issue with cruncher is that in most cases it does
  not produce any exceptions or logs when any of the SAItem.process calls fail, so
  we cannot know when/why a cruncher run failed (other than by seeing if it produces
  an empty output file).\r\n\r\n**The cause seems to be as follows:**\r\nCruncher
  hardcodes the \"verbose\" param in this SAItem process call to false: https://github.com/jdemetra/jdplus-main/blob/develop/jdplus-main-cli/jdplus-main-cli-bin/src/main/java/jdplus/cruncher/batch/SaBatchProcessor.java#L89\r\nThis
  causes cruncher to use a DummyLog rather than the DefaultProcessingLog class - https://github.com/jdemetra/jdplus-main/blob/develop/jdplus-main-base/jdplus-toolkit-base-parent/jdplus-toolkit-base-api/src/main/java/jdplus/toolkit/base/api/processing/DefaultProcessingLog.java\r\n\r\n**Feature
  request**\r\nWould it be possible to update cruncher with the following changes:\r\n1)
  allow users to parameterise cruncher to use \"verbose\" logging (i.e. log errors
  DefaultProcessingLog)\r\n2) return the content of the ProcessingLog to the user
  when the cruncher run completes."

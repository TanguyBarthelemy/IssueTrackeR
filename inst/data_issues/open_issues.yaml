  - "I did some testing in an attempt to figure out valid v3 keys for the parameter
    file. I've attached a spreadsheet with my findings in case they're of use to anyone
    else before the v3 output dictionary is produced.\r\n\r\n[v3ParameterFileTesting.xlsx](https://github.com/user-attachments/files/18030824/v3ParameterFileTesting.xlsx)\r\n\r\nNote
    that I only tested with one set of series, so it's likely that some of the keys
    that didn't work for me (e.g. trading day keys, backcasts) do actually work but
    weren't relevant for my series.\r\n\r\nThe keys I tested came from:\r\n- the default
    parameter file generated by cruncher when it's run without a parameter file\r\n-
    the v2 output dictionary\r\n- the v3 cruncher and RJDemetra columns from the spreadsheet
    in this ticket https://github.com/jdemetra/jdplus-main/issues/394\r\n\r\nThe **Worked**
    column shows keys that I confirmed can produce output- for <matrix> keys, they
    produced output in the relevant column in the demetra_m.csv file, and for <series>
    keys, they produced a csv file which contained output. The column is in alphabetical
    order and I haven't specified where I found each key.\r\n\r\nThe other columns
    show keys that didn't work and where I got them from. I removed a few keys which
    didn't work that were obviously renamed between v2 and v3. For example arima.th
    became arima.theta, and the a/b/c/d/e were moved under a different parent, so
    I didn't include them in the v2 column. \r\n\r\nAlso, there are a couple items
    in red on the first sheet- these ones didn't even produce a column header in demetra_m.
    That surprised me, because putting in random text still produces a column header.
    This may be a bug?"

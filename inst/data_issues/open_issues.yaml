    column if there is at least 1 entry for them. For example, if there are trading
    days it outputs regression.td(1), regression.td(2) and so on.\r\n\r\nWe will add
    an option to the cruncher to output the used dictionary with classes and descriptions.
    It is pretty much the parameters written in the default params file with some
    extra information.  "

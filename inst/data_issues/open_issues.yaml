- text:
  - |-
    Thanks for raising this.
    In Türkiye we faced a similar issue when adding Islamic (Hijri) moving holidays that are specific to our national calendar.

    If only a few years of single_day events are added, the computed long-term mean for trading-day correction may be distorted, because Lunar holidays shift 10–12 days earlier each Solar year and complete a full cycle roughly every 33 years.
    Hence, the effective long-term mean depends on including a full multi-decade span of data.

    For that reason, at TURKSTAT we use a complete daily list (1936–2035) of Islamic holidays provided by Diyanet, the official source for Türkiye.
    Using this dataset, the implicit long-term mean remains stable and consistent, avoiding biases from partial coverage.

    These holidays (Ramadan and Sacrifice Feasts) and their legal durations are specific to Türkiye, but the same approach can be adapted for other countries with Islamic-calendar events.
    Methodological background: Tüzen, Gökçin & Yiğit (2023) – The Calculation of Composite Calendar Regressors Including Moving Holidays in Türkiye.

    M. Fatih Tüzen (TURKSTAT)
  - |-
    Thanks a lot Fatih! We will take a deeper look at your paper that seems interesting.
    Taking into account the full calendar for long-term mean is very important not to bias your regressors.
  - Since single days only appear once, they do not affect the long-term mean. In
    most cases, this shouldn't be a problem, as  the ARIMA model should have a seasonal
    differentiation if there is a seasonality (the long-term mean is then removed).
  author:
  - MFatihTuzen
  - TanguyBarthelemy
  - AQLT
- text: []
  author: []
- text: []
  author: []
- text: []
  author: []
- text:
  - |-
    Hello,

    At the Turkish Statistical Institute (TURKSTAT) we have been handling Islamic (Hijri) moving holidays specific to Türkiye in seasonal and calendar adjustment for several years.

    We can share a daily Islamic-holiday calendar (1936–2035) derived from the Presidency of Religious Affairs (Diyanet) — the official national authority that determines Hijri–Gregorian dates based on astronomical and religious criteria approved by the International Hijri Calendar Union (2016).
    These dates are final and not revised later, and reflect the religious holiday schedule applicable in Türkiye.

    If technically feasible, these could be integrated into JDemetra+ as a country-specific calendar option (e.g., “Islamic holidays – Türkiye”), allowing users to include them directly in trading-day correction.

    All details are explained in our paper:
    Tüzen, Gökçin & Yiğit (2023) – The Calculation of Composite Calendar Regressors Including Moving Holidays in Türkiye, Journal of Statistical Research, 13(2), 13–27.

    Happy to share the full 1936–2035 daily list and discuss formats (CSV) suitable for integration.

    M. Fatih Tüzen (TURKSTAT)
  - For the time being, we are interested in your regressors (CSV is perfect for us).
  - 'In my opinion the problem is that, contrary to Easter, the Islamic holidays depends
    on the country. '

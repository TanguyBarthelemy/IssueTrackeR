- "JD+ only supports dates (`2010-01-01`) as I/O for observation periods.\r\nOther
  representations exists as well and could be integrated into a future release such
  as:\r\n- standard reporting period (`2010-Q1`, `2012-M12`)\r\n- time range (`2010-01-01/P3M`,
  `2012-12-01/P1M`)\r\n\r\nThese representations are already defined in the [SDMX
  specification](https://sdmx.org/wp-content/uploads/SDMX_2-1_SECTION_6_TechnicalNotes.pdf).\r\nJD+
  implementation should ensure that the solution doesn't break anything and stays
  backward compatible."

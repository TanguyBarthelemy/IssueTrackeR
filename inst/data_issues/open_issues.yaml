  - |-
    Hi just to clarify, you mean the file representation of a workspace or do you mean the complete structure of JDemetra with SaItems, TsVariables, ModellingContext? Changing the latter would mean a total redesign of JDemetra, the former is just one implementation of WorkspaceRepository and can be replaced even while the JDemetra application is running.
    A web API would be designed mostly from the ground up but in the end the data and statistical models still need to be provided by the user.

    To Git: We commit the whole Workspace.
  - |-
    Hi everyone, the structure I’m proposing in my package is not meant to replace the existing workspace (its structure remains unchanged) but rather to provide something that can be extracted from it.
    In practice, I extract the specifications from the workspace and store them in a JSON file. A workspace can also be rebuilt by merging the specifications and the data back together.

    I’m implementing everything in R, but doing the same in Java would not be an issue. I also noticed that in JD+GUI (v2) there’s something similar, where specifications can be extracted into .cfgx files, but in my opinion JSON offers a more readable format.

    <img width="557" height="670" alt="Image" src="https://github.com/user-attachments/assets/c9f70d9d-03bd-48fd-84ca-b77095842556" />

    You can find more details about my project here: https://github.com/AlessandroPiovani/RJDProcessor/blob/main/RJDProcessor/doc/package_description/IPS964_AlessandroPiovani_v2.pdf [IPS964_AlessandroPiovani_v2.pdf](https://github.com/user-attachments/files/22871353/IPS964_AlessandroPiovani_v2.pdf)
  - "Hi @AlessandroPiovani, \n\nTo import and export specification in R, you can use
    the functions from {rjd3workspace} `x13_write_spec` and `x13_read_spec`.\n\n[Exporting
    to `.cfgx` files](https://github.com/jdemetra/jdplus-main/issues/81) is obsolete,
    and working with XML files is very convenient (both human-readable and machine-readable). "
  - "Thank you @Immurb for your reply. Okay for Git, we're thinking about it at Insee
    too.\n\nI don't want to totally overhaul JDemetra+ of course ^^. \n\nMy question
    was more: \nGiven that we'll have to create a web API for JDemetra+, what's the
    future for the WS structure and to what extent will we have to separate models,
    data and output? "
  - |-
    Since the XML workspace (file representation) is in the jdplus-main-desktop part, I would expect it to be only relevant for the client software and stay relevant there.
    The web API will have another representation for workspace, if it has one at all. But that depends mainly on the functions provided by the web API.
  - "> Thank you [@Immurb](https://github.com/Immurb) for your reply. Okay for Git,
    we're thinking about it at Insee too.\n> \n> I don't want to totally overhaul
    JDemetra+ of course ^^.\n> \n> My question was more: Given that we'll have to
    create a web API for JDemetra+, what's the future for the WS structure and to
    what extent will we have to separate models, data and output?\n\nIf we decide
    to separate things (which I support), there should be two (or more) functions:
    one to split and another to rebuild the workspace. This approach ensures full
    compatibility with all components without changing anything in Java"

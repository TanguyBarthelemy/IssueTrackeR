- |+
  <img width="340" height="216" alt="Image" src="https://github.com/user-attachments/assets/cd77b619-d644-4d03-925e-6a858eeb3709" />

  While testing JDemetra+ 3.7.1, I noticed an unexpected behaviour in the **Benchmarking Results** output. The input series used in this example ends in **2025 Q1**. However, the table displayed under **Benchmarking Results** contains additional observations beyond the end of the available data. These values appear to be forecasted values generated internally by the benchmarking procedure.

  Although the forecasts themselves may be valid, they are displayed in the same table as the observed data without any visual distinction. As a result, it is difficult for users to identify where the original series ends and where the forecast period begins.

  Version: JDemetra+ 3.7.1


- |
  Related to cosa-tsa-shop/UserSupport#10

  In the section Matrix |> Outliers (from a SA-Processing), the version 2 and 3 differs by their presentation:

  - In version 2 we observe a column by outliers with type, position, coeff and T-Stats
  - In version 3 we observe 2 columns by outliers with coeffs and T-Stats

  Is it possible to include the outliers type and position in version 3?

  Here is the comparison:

  <img width="1920" height="1031" alt="Image" src="https://github.com/user-attachments/assets/825ba55f-8f7a-4309-ba9d-0ead44f26889" />
- |
  I generate a `demetra_m` output using the graphical interface (version 3.7.1) and I notice that the `td-ftest` column (`regression.td-ftest` item) is completely empty.
  Is this a connection error between the input and output?
  However, in version 2 (I tested version 2.2.6), for the same specifications and the same series, I do get an output.

  If necessary, I can provide a WS reprex.

  Thank you!
- "If two variables have the same value, only the last one will be read.\n\nHere is
  an example in R:\n\n``` r\nlibrary(\"rjd3workspace\")\npath_xml <- tempfile(fileext
  = \".xml\")\nwriteLines(\n    text = '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<tsVariables
  xmlns=\"ec/tss.core\">\n    <tsVariable name=\"VAR1\">\n        <tsdata>\n            <freq>12</freq>\n
  \           <firstYear>1990</firstYear>\n            <firstPeriod>1</firstPeriod>\n
  \           <data>0.0 0.0 1.2 1.3</data>\n        </tsdata>\n    </tsVariable>\n
  \   <tsVariable name=\"VAR2\">\n        <tsdata>\n            <freq>12</freq>\n
  \           <firstYear>1990</firstYear>\n            <firstPeriod>1</firstPeriod>\n
  \           <data>0.0 0.0 1.2 1.3</data>\n        </tsdata>\n    </tsVariable>\n</tsVariables>',
  \n    con = path_xml\n)\nnames(read_variables(path_xml))\n#> [1] \"VAR2\"\n```\n\n<sup>Created
  on 2026-04-24 with [reprex v2.1.1](https://reprex.tidyverse.org)</sup>\n"
- "Buenos días. \nEn la versión 3 de JJDemetra+ intento cargar el calendario para
  Argentina creado por mi, pero no lo reconoce la aplicación. El calendario se encuentra
  en formato cfgx y podía agregarlo en las versiones 2.0. De no agregar en las versiones
  3, ¿cuál sería la forma para agregar los calendarios particulares por países?\nDesde
  ya, muchas gracias.\nSaludos, \nGustavo Figueroa\n"
- "I try to understand why the output generation wors with the GUI sometimes and sometimes
  not.\n\nIn this issue, I will use the verbs \"compute\" and \"estimate\" to refer
  to the same thing: obtaining the results of the SA estimate for my series. But perhaps
  there is a fundamental difference between the two actions...\n\n## Example\n\nIn
  this example, I describe 7 different cases:\n\n1) A new SAP with a new SA-Item not
  computed (00:00)\n2) Same SA-Item computed \"by hand\" (by clicking on it) (00:06)\n3)
  Same SA-Item computed with the green arrow (00:16)\n4) A new SAP with a new SA-Item
  computed with the button `Start` (00:27)\n5) A new SAP with a new SA-Item computed
  with the button `Re-Run` (00:40)\n\nhttps://github.com/user-attachments/assets/47897424-7959-41ab-a5fe-3f50dd1ba7bf\n\n6)
  Adding a new SAI in a SAP (without computing it) (00:14)\n7) Compute the same SA-Item
  (by hand) (00:23)\n\nhttps://github.com/user-attachments/assets/7c1c67b4-64c8-45ef-ab3a-5c4bc471b594\n\n##
  Results\n\n|                                      | The `Output...` button is available
  | The `Output...` button is disabled |\n|:------------------------------------:|-------------------------------------|------------------------------------|\n|
  The `Batch output` box opens         | Case 3, 4, 5, 7                     |                                    |\n|
  The `Batch output` box does not open | Case 6                              | Case
  1, 2                          |\n\n\n## Question\n\nI understand that the \"computing\"
  is not just \"estimating\" with clicking by hand. \n\nBut:\n\n- Why the case 7 and
  case 2 are different?\n- Is the case 6 a bug?\n\n"
- |-
  In the GUI, it's possible to sort the SA-Item of a SA-Processing by **Reference spec**. But how is it handle?

  I notice (in this example) that this isn’t done by name and that the `^` and `v` keys aren’t used to reverse the direction.

  https://github.com/user-attachments/assets/c627e166-e28b-4de2-818f-821dd96c6b6c
- "> The EU Open Source Software Solutions Catalogue (EU OSS Catalogue) has been created
  by the FOSSEPS Preparatory initiative, [Free and Open Source Software for European
  Public Services](https://interoperable-europe.ec.europa.eu/collection/fosseps),
  which aims to promote cooperation at European Union level by giving visibility and
  facilitating the sharing and reuse of Open Source Solutions developed “by and for”
  public sector bodies in the European Union Member States.\n>  \n> This catalogue
  is based on a federated architecture of public APIs that generates a central pool
  of OSS Solutions collected by OSS Solutions Catalogues from EU Member States, at
  both National and Local level.\n> \n\nSee https://interoperable-europe.ec.europa.eu/eu-oss-catalogue/about\n\n>
  The EU OSS Catalogue adopts **the publiccode.yml standard** as its reference data
  model and qualifier for discovering / filtering OSS Solutions in the EU Public Sector.\n>
  \n> Publiccode.yml is a metadata standard designed to document and describe public
  sector software to help promote sharing and reuse. It uses a YAML file format to
  provide structured information about the solution’s features and characteristics
  (with both mandatory and optional information).\n> \n> Solutions that include publiccode.yml
  files in the root of their own public GIT repository, improve their interoperability
  and discoverability around Europe and Worldwide.\n\nExample: https://github.com/InseeFrLab/onyxia/blob/6a96798574f74b4af233d1ed71c5bc1333e7ac89/publiccode.yml#L4\n"
- "The aim of this issue is to find out whether, when I generate an excel output with
  the GUI, it's possible to choose the length of series which items ends with `(?)`.\n\nI
  will take the example of the forecasted series. \n\nIn X13-RegARIMA, there are forecasts
  in the preprocessing part but only with `(?)` items and it's not possible to set
  the number of forecasts generated by the Excel outputs in the GUI. In part X11,
  the number of forecasts cannot be chosen at the time of output. it depends on the
  number chosen in `Specifications` ▶ `X11` ▶ `Forecasts horizon`.\n\nIn this example,
  I chose 3 years of forecasts which will be applied to `t_f` and `i_f` but not to
  the other items that would have 1 year of forecast (by default):\n\n<img width=\"1205\"
  height=\"483\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/37c9acb2-9f52-40a4-ad3a-7b492944981e\"
  />\n\n"
- "*related to #882*\n\nI'm **not** talking here about the refresh policy that can
  be applied to a SA-Item or to a SA-Processing. \nI'm talking about the action that
  is executed each time a workspace is saved or when it is closed and reopened. The
  WS is saved in a **XML format** but some information are also updated (maybe in
  the **Java representation of the WS** in the GUI or elsewhere). \n\nThus, when the
  WS is \"refreshed\", certain elements that have just been modified become \"accessible\"
  (as in the case of issue #882). \nFor example, this is also the case when modifying
  domainSpec (with button `use estimation spec`), which will copy the estimation spec
  if the WS has been saved. \n\nIn these example, it's not related to the XML files,
  I checked.\n\nI haven't provided a screenshot. If necessary I can introduce a few
  steps to reproduce the problem.\n\nMaybe, the button I'm looking for is just the
  `Save Workspace` button but as the problem doesn't concerns the XML files, I'ms
  thinking it can be possible to update a WS without saving it? For example for testing
  before saving?"
- |
  I thought I already open an issue about this subject but I can't find any trace of it in older issues...

  ### Situation

  Some SA-Items that have been deleted reappear when I add other series.

  ### Steps to reproduce

  1) Create a new WS
  2) Create a SA-Processing
  3) Add SA-items
  4) Remove one of the SA-Items
  5) Add a new SA-Item

  ### Example

  https://github.com/user-attachments/assets/90606c05-191e-485c-8270-a7faacf9a3b9
- |+
  Related to #867

  At the moment, in my mind, the cuncher does 3 things:

  - updating the raw data (linked via the ts metadata)
  - refreshing the model (so the estimation policy) according to the chosen refresh policy
  - producing outputs (demetra_m and series)

  But is it possible to choose to run **only one or two** of the tasks described above?

  For example, just producing output or just updating the data without refreshing the model.

- "The function `rjd3toolkit::seasonality_kruskalwallis()` compute the Kruskal-Wallis
  test. But how is it implemented in x13 call?\n\nHere is a small example. I get two
  different result if I want to compute it directly from the raw data and get it from
  the user defined variables:\n\n``` r\nlibrary(\"rjd3x13\")\n#> \n#> Attaching package:
  'rjd3x13'\n#> The following object is masked from 'package:grDevices':\n#> \n#>
  \    x11\nlibrary(\"rjd3toolkit\")\n#> \n#> Attaching package: 'rjd3toolkit'\n#>
  The following objects are masked from 'package:stats':\n#> \n#>     aggregate, mad\nmodel
  <- x13(AirPassengers, spec = x13_spec(name = \"rsa3\"), userdefined = \"diagnostics.seas-lin-kw\")\nrjd3toolkit::seasonality_kruskalwallis(AirPassengers)\n#>
  Value: 11.14777 \n#> P-Value: 0.4310\nmodel$user_defined$`diagnostics.seas-lin-kw`\n#>
  Value: 124.4844 \n#> P-Value: 0.0000\n```\n\n<sup>Created on 2026-02-05 with [reprex
  v2.1.1](https://reprex.tidyverse.org)</sup>\n\nThank you!"
- |+
  Hello,

  I am using JDemetra+ 3.6.0 with jwsacruncher 3.6.0, and I noticed that the CSV matrix output (demetra_m) in JD3 is missing some parameters and diagnostics that were present in the CSV matrix output in JD2 versions.
  With JD3, the demetra_m is only partially filled, several parameters and diagnostics visible in the GUI (e.g. regression effects / ramps, some diagnostics) are missing or empty in the CSV output, even though all series have valid final models.
  I am attaching two CSV files for comparison:
  demetra_m (output with jwsacruncher-2.2.4) from JD2 (more complete). [example_with_JD2.csv](https://github.com/user-attachments/files/24881688/example_with_JD2.csv)
  demetra_m  (output with jwsacruncher-3.6.0)  from JD3 (missing parameters). [example_with_JD3.csv](https://github.com/user-attachments/files/24881699/example_with_JD3.csv)
  The main parameters I am asking about are : user.1 (about added ramps), arima, mean and some last diagnostic tests and quality.
  My question is:
  Is it possible to include these missing parameters and diagnostics in the JD3 CSV matrix output, or is their removal intentional by design?

  Thank you very much for your help.

- "Related to #594 \n\nThe GUI output does not allow you to specify the number of
  elements to be displayed in the boxes `(?)`.\n\nFor certain variables, it is interesting
  to request additional columns (in particular, diagnostics, modality, comments, values
  and p-values...). For cruncher queries, you can provide the number of elements between
  brackets when there's a question mark `(?)`.\n\n\nBut with the GUI, it's not possible
  to specify an item outside the list (or I didn't understand how to ask)."

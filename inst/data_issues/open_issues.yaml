  ![Image](https://github.com/user-attachments/assets/d4a65a9a-3173-4e67-80a3-1e1f4cdd7ee7)

  If the user then looks at the **Summary** section of the **Main **results**** section in the output area for the series, the labelling for these pre-specified outliers is confusing:

  ![Image](https://github.com/user-attachments/assets/13e3bb60-a0f3-4905-839c-5ece0d7bc286)

  In this summary section, the fixed outliers (only) have been separated out. But because it firstly says '2 pre-specified outliers', it seems as though there are only 2 in total. However, all types of outliers, whether fixed or not, should be deemed 'pre-specified outliers', because they must be specified by the user in advance.

  It would be better to display the information similar to below:

  ```
  3 pre-specified outliers
  2 non-fixed [or say 'estimated' instead]
  1 fixed
  ```

  There should also be a newline between 'No easter effect' and '2 pre-specified outliers' in the example above to further improve comprehension of the information about outliers.

  Note there is further confusion when auto-outliering is enabled. If I switch it on for the example above, it now seems there are only 2 outliers: 1 that is detected, and 1 that is fixed:

  ![Image](https://github.com/user-attachments/assets/f3b8fb2f-3b4f-4359-a43e-f99854d16f38)

  My suggestion is as follows (noting importantly the newlines):

  ```
  4 outliers total

  1 detected outlier [or say 'automatically inserted' instead to be clearer; 'detected' means 'identified', it doesn't mean 'identified and corrected']

  3 pre-specified outliers
  2 non-fixed
  1 fixed
  ```

  If newlines aren't acceptable, then perhaps the following is best (that is, just ignore the fixed vs non-fixed distinction):

  ```
  4 outliers total
  1 automatic outlier
  3 pre-specified outliers
  ```

title:
- Error on short series
- How to differentiate a WS in V2 and in V3?
- Possible to extract slidingspan main diagnostics ?
- Printing userdef variables with their name
- Leap Year Effect
body:
- |-
  With short quaterly series, the estimation fails when beginning in 2023 but success in 2024.
  In **RSA5c**, it may be related to the calendar regressor (because it doesn't fail with **RSA3**).

  Here is a reproductible example:

  ``` r
  library("RJDemetra")

  set.seed(3)
  x <- rnorm(12)

  mod1 <- x13(ts(x, frequency = 4L, start = 2024), spec = "RSA5c")
  mod2 <- x13(ts(x, frequency = 4L, start = 2023), spec = "RSA5c")
  #> Error in x13JavaResults(jrslt = jrslt, spec = jrspec, userdefined = userdefined): [preprocessing: failed]
  ```

  <sup>Created on 2025-05-27 with [reprex v2.1.1](https://reprex.tidyverse.org)</sup>

  With 1 or 2 more points, the estimate succeds. Is this linked to the number of calendar regressors or to one in particular (LY?)?
- |-
  *related to rjdverse/rjd3workspace#53*

  When I try to load a WS in v3 with **{RJDemetra}** (with `load_workspace()`), I get no error but I will get error when trying to access other elements.

  How to know if a WS is in V3 with **{RJDemetra}**? Is it possible?
- "I wondered if it was possible in rjdemetra to extract and save the main slidingspan
  diagnostics of % unstable observations (A% and MM%) that are calculated  and displayed
  (but not saved) in JDemetra+ ?\r\n\r\nI guess this is not an “issue”, but rather
  a (Christmas) wish\r\n\r\nBest regards \r\nJørn Ivar Hamre\r\n(Statistics Norway)\r\n"
- "When you display a model (obtained with the get_model function), the regression
  variables are not displayed with their real name but with a name given by jdemetra+:\r\n\r\n![image](https://github.com/jdemetra/rjdemetra/assets/112711017/2dc551f8-2c0a-4da0-bc12-d74285537247)\r\n\r\nHowever,
  their variable name does exist in the object:\r\n\r\n![image](https://github.com/jdemetra/rjdemetra/assets/112711017/7645a392-6e06-4480-b832-282b83ec77da)\r\n\r\nIs
  it possible to modify the display to add these more meaningful variable names instead
  of the current names?"
- "I am running into problems including the leap year:\r\nhttps://github.com/statistikat/persephone/issues/21\r\n\r\nAm
  I missing some additional parameters that need to be set?"

comments:
  https://api.github.com/repos/rjdverse/rjdemetra/issues/164: Do you have the same
    issue with the GUI? If so then it is a a JDemetra+ issue.
  https://api.github.com/repos/rjdverse/rjdemetra/issues/162: .na.character
  https://api.github.com/repos/rjdverse/rjdemetra/issues/156: "Hi,\r\n\r\nit is indeed
    a wish ! We'll see...\r\n\r\nMerry Xmas"
  https://api.github.com/repos/rjdverse/rjdemetra/issues/142: "They do not come from
    the same object and there are some differences in the Java output. \r\nIn the
    first case the names comes from the results of the regarima model (<https://github.com/rjdverse/rjdemetra/blob/develop/R/regarima_rslts.R#L52>)
    and in the second case it comes from the specification (<https://github.com/rjdverse/rjdemetra/blob/develop/R/spec_rjd.R#L193-L220>).
    I think it would be complicated to do it in R since you would need to indentify
    your external regressors from all the regressions coefficients (outliers, easter,
    td, etc.), but maybe something can be done using the `context_dictionary`. Do
    you have a reproducible example?"
  https://api.github.com/repos/rjdverse/rjdemetra/issues/76: .na.character

- text:
  - |-
    Hi could you be more specific and maybe provide an example?
    Where are you looking for the model?
    Are you using multi-documents or just documents under seasonal adjustment?
    Was it working in an older 3.X version?
  - "I am using multi-documents and I do not know if it worked in an older 3.X version.\r\n\r\nIn
    the attached file, you will find the example you asked for.\r\n\r\nFigure 1 (node
    \"Main results\"): the Seats model is not reported.\r\n\r\nFigure 2 (node \"Pre-processing
    -> Arima\"): only the model identified in Tramo is reported (versions 2.x.x. reported
    the same information for the model used by Seats).    \r\n\r\nFigure 3 (node \"Decomposition\"):
    The model used for the decomposition (reported in the section \"Model\") is not
    reported in the form (P,D,Q)(BP,BD,BQ). In the example, the model (orders and
    coefficients) can be deduced quite easily, but more complex models could take
    experience and time.\r\n\r\n   \r\n\r\n----- Messaggio originale -----\r\nDa:
    \"Thomas Witthohn\" ***@***.***>\r\nA: \"jdemetra/jdplus-main\" ***@***.***>\r\nCc:
    \"Anna Ciammola\" ***@***.***>, \"Author\" ***@***.***>\r\nInviato: Mercoledì,
    19 marzo 2025 13:25:32\r\nOggetto: Re: [jdemetra/jdplus-main] Model changed by
    Seats - output (Issue #562)\r\n\r\nImmurb left a comment (jdemetra/jdplus-main#562)\r\n\r\nHi
    could you be more specific and maybe provide an example?\r\nWhere are you looking
    for the model?\r\nAre you using multi-documents or just documents under seasonal
    adjustment?\r\nWas it working in an older 3.X version?\r\n\r\n-- \r\nReply to
    this email directly or view it on GitHub:\r\n https://urlsand.esvalabs.com/?u=https%3A%2F%2Fgithub.com%2Fjdemetra%2Fjdplus-main%2Fissues%2F562%23issuecomment-2736451942&e=2637b01d&h=841c7250&f=y&p=y
    \r\nYou are receiving this because you authored the thread.\r\n\r\nMessage ID:
    ***@***.***>"
  - "Hello ! The problem is slightly more complex: with some parameters (\"noisy\"),
    the model modified by SEATS is not a usual SARIMA model any more. More exactly,
    the moving average part is more complex and can't be expressed with Q, BQ and
    the corresponding coefficients.\nSo, the solution would be to mention if the modified
    model is still a SARIMA and then only, to provide the usual information.\nI don't
    know if that's really useful and what would be the actual added value (the algorithms
    used for the canonical decomposition just use generic ARIMA models) "
  - "Hello!\r\n\r\nI will describe what happened with JDemetra+ 2.x.x.\r\n\r\nWhen
    Tramo model was not decomposed by Seats, one of the approaches used in the production
    of OFFICIAL seasonally adjusted data was based on the manual identification of
    a decomposable model (sometimes the model used by Seats was initially imposed
    and then improved).\r\n\r\nWith the partial concurrent approach a decomposable
    model was preferred for two reasons:\r\n1) forecasts of unadjusted series (in
    Tramo) and forecasts of components (in Seats) were consistent;\r\n2) we were 100%
    sure that seasonally adjusted data were generated through the same model.\r\n\r\nTo
    corroborate item 2): let us think of a time series whose model M1 does not admit
    a decomposition. M1 is then \"approximated\" with a different model M2. Adding
    a new observation, M1 coefficients change and now M1 admits a decomposition. This
    can generate large revisions (or larger than usual).\r\n\r\nHave the previous
    issues been overcome with the new JD+ 3.x.x.?\r\nIf yes, my previous request can
    be easily ignored.\r\n   \r\n     \r\n\r\n----- Messaggio originale -----\r\nDa:
    \"Jean Palate\" ***@***.***>\r\nA: \"jdemetra/jdplus-main\" ***@***.***>\r\nCc:
    \"Anna Ciammola\" ***@***.***>, \"Author\" ***@***.***>\r\nInviato: Giovedì, 20
    marzo 2025 17:14:19\r\nOggetto: Re: [jdemetra/jdplus-main] Model changed by Seats
    - output (Issue #562)\r\n\r\npalatej left a comment (jdemetra/jdplus-main#562)\r\n\r\nHello
    ! The problem is slightly more complex: with some parameters (\"noisy\"), the
    model modified by SEATS is not a usual SARIMA model any more. More exactly, the
    moving average part is more complex and can't be expressed with Q, BQ and the
    corresponding coefficients.\r\nSo, the solution would be to mention if the modified
    model is still a SARIMA and then only, to provide the usual information.\r\nI
    don't know if that's really useful and what would be the actual added value (the
    algorithms used for the canonical decomposition just use generic ARIMA models)
    \r\n\r\n-- \r\nReply to this email directly or view it on GitHub:\r\n https://urlsand.esvalabs.com/?u=https%3A%2F%2Fgithub.com%2Fjdemetra%2Fjdplus-main%2Fissues%2F562%23issuecomment-2740995244&e=2637b01d&h=5eb7ac3b&f=y&p=y
    \r\nYou are receiving this because you authored the thread.\r\n\r\nMessage ID:
    ***@***.***>\r\n"

title:
- Change of reference specification in SAProcessing is not working
- Model changed by Seats - output
- user-defined calendar effect names do not appear in demetra-m.csv
- User-defined calendar effects
- Better handling of coefficients/parameters in the GUI
- No new logo in shortcuts
- Add time filter in UI components
- Use Platform-Specific Desktop Features from JDK 9
- Use enhanced Pseudo-Random Number Generators from JDK 17
- '[FR] decimal separator in the JWSACruncher'
body:
- |-
  I changed the reference specification from RSAfull to x11 and then the specification wasn't changed:

  <img width="991" height="603" alt="Image" src="https://github.com/user-attachments/assets/719f1e55-d3f6-4c3e-9d54-6ac304e7a84e" />
- JDemetra 3.4.0 - When the TRAMO model is not decomposed, the representation (P,D,Q)(BP,BD,BQ)s  of
  the Seats model is not available.
- "user-defined calendar effect names do not appear in demetra-m.csv file.\r\n![calendar
  effec_demetram](https://github.com/user-attachments/assets/267217bf-e37c-40bd-913e-324a5dc48d79)\r\n\r\n\r\n\r\n"
- Better handling of user-defined calendar effects (output, gui)
- "Improve the naming of coefficients/parameters in the spec boxes\r\nHide coefficients
  when they can't be specified (undefined transformation)"
- "the new logo appears just in the top left corner of the open GUI but not in the
  short cuts \r\n\r\n\r\n![image](https://github.com/jdemetra/jdplus-main/assets/43274870/d5c4ca0c-9d70-42ee-bd40-97a2714db224)\r\n"
- See https://github.com/jdemetra/jdplus-main/blob/develop/jdplus-main-base/jdplus-toolkit-base-parent/jdplus-toolkit-base-api/src/main/java/jdplus/toolkit/base/api/timeseries/TimeSelector.java
- "See https://openjdk.org/jeps/272\r\n\r\nMost [nbbrd desktop API](https://github.com/nbbrd/java-desktop-util/)
  can be replaced by the latest JDK desktop API. \r\nThere are a few exceptions anyway:
  search and kwown folders"
- See https://openjdk.org/jeps/356
- It could be good to be able to change the decimal separator in the JWSACruncher
  to avoid a system dependency. This is linked to https://github.com/jdemetra/jwsacruncher/issues/13.

title:
- Fix config import in ProvidersTopComponent
- Fix missing ARM-based packages in releases
- Fix SQL queries
- User-defined variables with lags
- Fix default toolbar and menu
- seasonal filter not shown in X-11
body:
- Config import in ProvidersTopComponent doesn't work anymore. Export is OK.
- For some reasons, the packages are created at release time but are not added to
  the release page.
- SQL queries fail on cube with more than 2 dimensions.
- User-defined variables with lags are not included in the model
- Remove some default items from the toolbar and menu of the NetBeans Platform
- The `Decomposition (X11) > Final filters` panel only shows the trend filter and
  not the seasonal filter. Is this intentional?
